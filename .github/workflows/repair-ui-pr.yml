name: Execute UI Repair

on:
  pull_request:
    paths:
      - ui-repair-trigger.txt

permissions:
  contents: write

concurrency:
  group: execute-ui-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic UI repair
        run: python scripts/repair-ui.py

      - name: Audit HTML, CSS, JavaScript, and i18n
        run: node scripts/ui-audit.mjs

      - name: Commit repaired website
        run: |
          rm -f .github/workflows/ui-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html i18n.js i18n.css portal-sso.js maintenance-dev-hub.css scripts/ui-audit.mjs
          git commit -m "fix: restore UI text and contrast"
          git push origin HEAD:main
