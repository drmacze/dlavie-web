name: Refresh Launcher Download Experience

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_download_experience.py'
      - '.github/workflows/refresh-download-experience.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply website migration
        run: python3 .github/scripts/refresh_download_experience.py

      - name: Validate generated HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<!-- DLAVIE_DOWNLOAD_V2 -->',
              'refreshLauncherRelease(true)',
              'data-launcher-version',
              'DLavie26-Launcher-v325.apk',
              'FIFA MODDING LAUNCHER',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing generated markers: {missing}')
          print('Generated download experience validated.')
          PY

      - name: Commit generated website update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No website changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: simplify launcher download and use GitHub manifest'
          git push
