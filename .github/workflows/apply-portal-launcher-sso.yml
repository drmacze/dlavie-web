name: Apply Portal Launcher SSO

on:
  push:
    branches: [main, feat/guided-launcher-connect]
    paths:
      - 'portal-sso.js'
      - '.github/scripts/apply_portal_launcher_sso.py'
      - '.github/workflows/apply-portal-launcher-sso.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal-sso.js'
      - '.github/scripts/apply_portal_launcher_sso.py'
      - '.github/workflows/apply-portal-launcher-sso.yml'

permissions:
  contents: write

concurrency:
  group: portal-launcher-sso-${{ github.ref }}
  cancel-in-progress: false

env:
  VERIFIED_CALLBACK: https://drmacze.github.io/launcher/auth/callback/
  RELEASE_CERT_SHA256: 4F:6C:88:4E:E6:DF:76:4B:B5:CD:B2:B6:B6:C1:3A:FA:95:16:4B:A9:20:7E:E6:95:27:4F:51:FC:DA:DC:09:B0

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Portal SSO patch
        run: python3 .github/scripts/apply_portal_launcher_sso.py

      - name: Validate security and guided-flow invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<script src="portal-sso.js"></script>' index.html
          grep -F 'window.DLaviePortalSso.connect()' index.html
          grep -F "code_challenge_method', 'S256'" portal-sso.js
          grep -F "const VERIFIED_CALLBACK = '${VERIFIED_CALLBACK}';" portal-sso.js
          grep -F 'normalizeRequestedCallback' portal-sso.js
          grep -F 'isTrustedCallbackResult' portal-sso.js
          grep -F 'callback_uri' portal-sso.js
          grep -F 'captureLauncherStartIntent' portal-sso.js
          grep -F 'renderLauncherStartGuide' portal-sso.js
          grep -F 'Lanjutkan ke Launcher' portal-sso.js
          grep -F 'Memverifikasi akun Portal' portal-sso.js
          grep -F 'Kembali ke Launcher' portal-sso.js
          grep -F 'Kode sekali pakai' portal-sso.js
          grep -F 'sb_publishable_' index.html portal-sso.js
          ! grep -F 'intent://connect?token=' index.html portal-sso.js
          ! grep -F 'dlavie://connect?token=' index.html portal-sso.js
          ! grep -F 'eyJpc3MiOiJIUzI1NiI' index.html portal-sso.js
          node --check portal-sso.js

      - name: Verify live Digital Asset Links association
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-redirs 0 \
            -H 'Cache-Control: no-cache' \
            "https://drmacze.github.io/.well-known/assetlinks.json?run=${GITHUB_RUN_ID}" > /tmp/assetlinks.json
          curl --fail --silent --show-error --max-redirs 0 \
            -H 'Cache-Control: no-cache' \
            "${VERIFIED_CALLBACK}?run=${GITHUB_RUN_ID}" > /tmp/callback.html
          python3 - <<'PY'
          import json
          import os
          with open('/tmp/assetlinks.json', encoding='utf-8') as handle:
              statements = json.load(handle)
          matches = []
          for statement in statements:
              target = statement.get('target') or {}
              if (
                  'delegate_permission/common.handle_all_urls' in (statement.get('relation') or [])
                  and target.get('namespace') == 'android_app'
                  and target.get('package_name') == 'com.drmacze.f16launcher'
                  and os.environ['RELEASE_CERT_SHA256'] in (target.get('sha256_cert_fingerprints') or [])
              ):
                  matches.append(statement)
          if len(matches) != 1:
              raise SystemExit('Digital Asset Links association mismatch')
          with open('/tmp/callback.html', encoding='utf-8') as handle:
              callback = handle.read()
          if 'DLavie Secure Connect' not in callback:
              raise SystemExit('verified callback fallback is not live')
          if 'dlavie://portal-complete' in callback or 'access_token' in callback or 'refresh_token' in callback:
              raise SystemExit('callback fallback forwards sensitive data')
          print('Verified App Link host is live and matches the release certificate.')
          PY

      - name: Verify Portal Google PKCE contract
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL='https://lvmucsxbmadtsgrxuwmo.supabase.co'
          API_KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" portal-sso.js | head -1)
          curl --fail --silent --show-error \
            -H "apikey: ${API_KEY}" \
            "${SUPABASE_URL}/auth/v1/settings" > /tmp/settings.json
          python3 - <<'PY'
          import json
          with open('/tmp/settings.json', encoding='utf-8') as handle:
              settings = json.load(handle)
          if (settings.get('external') or {}).get('google') is not True:
              raise SystemExit('Google provider is disabled')
          PY
          CHALLENGE='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          REDIRECT=$(python3 -c "import urllib.parse; print(urllib.parse.quote('https://drmacze.github.io/dlavie-web/', safe=''))")
          STATUS=$(curl --silent --show-error --max-redirs 0 \
            -D /tmp/oauth-headers.txt -o /tmp/oauth-body.txt \
            -H "apikey: ${API_KEY}" \
            -w '%{http_code}' \
            "${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${REDIRECT}&code_challenge=${CHALLENGE}&code_challenge_method=S256&prompt=select_account" || true)
          test "$STATUS" = '302' -o "$STATUS" = '303'
          LOCATION=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/oauth-headers.txt)
          echo "$LOCATION" | grep -Ei 'google\.com|accounts\.google'

      - name: Verify backend callback allow-list
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" portal-sso.js | head -1)
          ENDPOINT='https://lvmucsxbmadtsgrxuwmo.supabase.co/functions/v1/launcher-sso'
          COMMON='"action":"authorize","capability":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","code_challenge":"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB","state":"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"'

          EVIL_STATUS=$(curl --silent --show-error -o /tmp/evil-callback.json -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H 'Origin: https://drmacze.github.io' \
            -H 'Content-Type: application/json' \
            -d "{${COMMON},\"callback_uri\":\"https://attacker.example/callback/\"}")
          test "$EVIL_STATUS" = '400'
          grep -F 'invalid_callback_uri' /tmp/evil-callback.json

          VERIFIED_STATUS=$(curl --silent --show-error -o /tmp/verified-callback.json -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H 'Origin: https://drmacze.github.io' \
            -H 'Content-Type: application/json' \
            -d "{${COMMON},\"callback_uri\":\"${VERIFIED_CALLBACK}\"}")
          test "$VERIFIED_STATUS" = '401'
          grep -F 'authentication_required' /tmp/verified-callback.json

          LEGACY_STATUS=$(curl --silent --show-error -o /tmp/legacy-callback.json -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H 'Origin: https://drmacze.github.io' \
            -H 'Content-Type: application/json' \
            -d "{${COMMON}}")
          test "$LEGACY_STATUS" = '401'
          grep -F 'authentication_required' /tmp/legacy-callback.json

      - name: Verify SSO rejects forged exchange
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" portal-sso.js | head -1)
          STATUS=$(curl --silent --show-error \
            -o /tmp/sso.json -w '%{http_code}' \
            -X POST 'https://lvmucsxbmadtsgrxuwmo.supabase.co/functions/v1/launcher-sso' \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"exchange","auth_code":"invalid","code_verifier":"invalid","state":"invalid"}')
          test "$STATUS" = '400'
          grep -F 'invalid_request' /tmp/sso.json

      - name: Commit materialized Auth source
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html portal-sso.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal-sso.js
          git commit -m 'feat: materialize guided launcher connection flow'
          git push
